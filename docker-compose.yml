services:
  # ==================== Backend API ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimiter-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ratelimiter}:${POSTGRES_PASSWORD:-ratelimiter}@postgres:5432/${POSTGRES_DB:-ratelimiter}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ratelimiter-network
    healthcheck:
      test: ["CMD", "bun", "run", "src/scripts/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:16-alpine
    container_name: ratelimiter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ratelimiter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ratelimiter}
      - POSTGRES_DB=${POSTGRES_DB:-ratelimiter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ratelimiter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratelimiter} -d ${POSTGRES_DB:-ratelimiter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ratelimiter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ==================== Networks ====================
networks:
  ratelimiter-network:
    driver: bridge

# ==================== Volumes ====================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
